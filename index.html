<h1>ふいうち戦略アシスタント</h1><div class="intro"><p>1つのサイトで「簡略版」と「拡張版」を切り替えられます。各ターン、計算された最適混合戦略に従って乱数で行動を1つ選び、推奨行動として表示します。</p><p class="note">乱数による推奨は、その時点の最適行動確率に基づくサンプリングです。表示された推奨行動を参考に、自分の行動ボタンを選んでください。対戦履歴の「ひとつ前の選択に戻る」で直前のターンを取り消せます。</p></div>
